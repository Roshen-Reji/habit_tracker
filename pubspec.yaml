  image_picker: ^1.0.7
  google_generative_ai: ^0.4.3
  path_provider: ^2.1.2
  flutter_animate: ^4.5.2
  file_picker: ^8.1.3
  lucide_icons_flutter: ^3.1.14+2

dev_dependencies:
  flutter_test:
