name: habit_tracker
description: Commander Habit Tracker App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Your existing packages based on your code:
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.2.0
  youtube_player_flutter: ^9.1.3
  intl: ^0.20.2
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  http: ^1.1.0

  # NEW packages for the Health AI Feature:
  image_picker: ^1.0.7
  palette_generator: ^0.3.3+3
  path_provider: ^2.1.2
  flutter_animate: ^4.5.2
  rive: 0.14.9
  file_picker: ^8.1.4
  lucide_icons_flutter: ^3.1.14+2
  material_3_expressive: ^1.0.7
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.4
  pdfrx: ^2.4.8
  flutter_quill: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/icon.png"
  android_12:
    color: "#000000"
    image: "assets/icon.png"

flutter:
  uses-material-design: true