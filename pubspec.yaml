name: habit_tracker
description: Commander Habit Tracker App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Your existing packages based on your code:
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.65.0
  just_audio: ^0.9.36
  on_audio_query: ^2.9.0
  youtube_player_flutter: ^9.0.3
  intl: ^0.18.1
  permission_handler: ^11.0.1
  flutter_local_notifications: ^17.0.0
